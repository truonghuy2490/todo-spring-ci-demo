# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml


trigger:
  - main

pr:
  - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: ApiValidation
    displayName: API Validation
    jobs:
      - job: BuildAndTestApi
        displayName: Build and test Spring Boot API
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: Set up Java 17
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - script: |
              chmod +x mvnw
              ./mvnw --batch-mode clean verify
            displayName: Build and generate coverage

          - task: PublishPipelineArtifact@1
            displayName: Publish JaCoCo coverage report
            condition: always()
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/target/site/jacoco'
              artifact: 'jacoco-coverage-report'
              publishLocation: 'pipeline'
      
          - task: PublishPipelineArtifact@1
            displayName: Publish Spring Boot JAR
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/target'
              artifact: 'spring-boot-app'
              publishLocation: 'pipeline'

  - stage: UiValidation
    displayName: UI Validation
    dependsOn: ApiValidation
    condition: succeeded()
    jobs:
      - job: ValidateUiPlaceholder
        steps:
          - script: |
              echo "UI validation placeholder passed."
              echo "Replace this step when a frontend is added."
            displayName: Placeholder UI validation

  
  - stage: Deploy
    displayName: Deploy to Azure App Service
    dependsOn:
      - ApiValidation
      - UiValidation
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

    jobs:
      - job: DeployWebApp
        displayName: Deploy Spring Boot application
        steps:
          - download: current
            artifact: spring-boot-app

          - task: AzureWebApp@1
            displayName: Deploy to todo-demo
            inputs:
              azureSubscription: 'todo-azure-connection'
              appType: webAppLinux
              appName: 'todo-demo'
              package: '$(Pipeline.Workspace)/spring-boot-app/*.jar'
              runtimeStack: 'JAVA|17-java17'


