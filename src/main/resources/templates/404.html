<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>404 - Page Not Found</title>

    <!-- Bootstrap 4.6.2 CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
          crossorigin="anonymous">

    <style>
        body {
            min-height: 100vh;
            background-color: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            width: 100%;
            max-width: 650px;
            padding: 2rem 1rem;
        }

        .error-card {
            border: 0;
            border-radius: 12px;
            box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.08);
        }

        .error-code {
            font-size: clamp(6rem, 20vw, 9rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -5px;
            color: #007bff;
        }

        .error-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background-color: #e8f1ff;
            color: #007bff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 600;
        }

        .btn {
            border-radius: 6px;
            padding: 0.65rem 1.25rem;
        }
    </style>
</head>

<body>

<main class="container error-container">
    <div class="card error-card">
        <div class="card-body text-center p-4 p-md-5">

            <div class="error-icon" aria-hidden="true">
                !
            </div>

            <div class="error-code mb-3">404</div>

            <h1 class="h3 font-weight-bold mb-3">
                Page Not Found
            </h1>

            <p class="text-muted mb-2">
                Oops! The page you're looking for doesn't exist.
            </p>

            <p class="text-muted mb-4">
                It may have been moved, deleted, or the URL might be incorrect.
            </p>

            <div class="d-flex flex-column flex-sm-row
                        justify-content-center">
                <a th:href="@{/todos}"
                   class="btn btn-primary mb-2 mb-sm-0 mr-sm-2">
                    &larr; Back to Tasks
                </a>

                <button type="button"
                        class="btn btn-outline-secondary"
                        onclick="history.back()">
                    Go Back
                </button>
            </div>

        </div>
    </div>

    <p class="text-center text-muted small mt-4">
        Todo App &middot; Let's get you back on track.
    </p>
</main>

</body>
</html>
