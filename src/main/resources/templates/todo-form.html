<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${pageTitle}">Task form</title>

    <!-- Bootstrap 4.6.2 CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
          crossorigin="anonymous">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .form-container {
            max-width: 650px;
        }

        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1080;
            width: calc(100% - 2rem);
            max-width: 360px;
        }

        .toast {
            min-width: 0;
            width: 100%;
            box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.12);
        }
    </style>
</head>

<body>
<!-- Toast notifications: supports both model and flash attributes -->
<div class="toast-container" aria-live="polite" aria-atomic="true">

    <div th:if="${message}"
         id="successToast"
         class="toast border-success"
         role="status"
         aria-live="polite"
         aria-atomic="true"
         data-autohide="true"
         data-delay="4000">

        <div class="toast-header bg-success text-white">
            <strong class="mr-auto">Success</strong>
            <button type="button"
                    class="ml-2 mb-1 close text-white"
                    data-dismiss="toast"
                    aria-label="Close notification">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>

        <div class="toast-body" th:text="${message}">
            Operation completed successfully.
        </div>
    </div>

    <div th:if="${error}"
         id="errorToast"
         class="toast border-danger"
         role="alert"
         aria-live="assertive"
         aria-atomic="true"
         data-autohide="true"
         data-delay="5000">

        <div class="toast-header bg-danger text-white">
            <strong class="mr-auto">Error</strong>
            <button type="button"
                    class="ml-2 mb-1 close text-white"
                    data-dismiss="toast"
                    aria-label="Close notification">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>

        <div class="toast-body" th:text="${error}">
            Something went wrong.
        </div>
    </div>

</div>

<div class="container form-container py-5">
    <div class="mb-4">
        <a th:href="@{/todos}"
           class="text-decoration-none">
            &larr; Back to tasks
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 font-weight-bold mb-2"
                th:text="${pageTitle}">
                Task form
            </h1>

            <p class="text-muted mb-4">
                Enter a descriptive title for your task.
            </p>

            <form th:action="${formAction}"
                  th:object="${task}"
                  method="post"
                  novalidate>

                <div class="form-group">
                    <label for="title" class="font-weight-bold">
                        Task title
                    </label>

                    <input id="title"
                           type="text"
                           th:field="*{title}"
                           class="form-control"
                           th:classappend="${error != null} ? ' is-invalid' : ''"
                           placeholder="e.g. Complete the coding assessment"
                           maxlength="255"
                           autocomplete="off"
                           autofocus
                           required>

                    <small class="form-text text-muted">
                        The title cannot be empty or contain only spaces.
                    </small>
                </div>

                <div class="d-flex flex-column flex-sm-row">
                    <button type="submit"
                            class="btn btn-primary mr-sm-2 mb-2 mb-sm-0">
                        Save Task
                    </button>

                    <a th:href="@{/todos}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 4 JavaScript dependencies -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

<script>
    $(function () {
        $('#successToast').toast('show');
        $('#errorToast').toast('show');
    });
</script>
</body>
</html>
